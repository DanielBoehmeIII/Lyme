# Week 6 — First SFT Run Configuration
# Target: deepseek-coder:6.7b with QLoRA

model:
  name: "deepseek-ai/deepseek-coder-6.7b-instruct"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  device_map: "auto"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

quantization:
  enabled: true
  method: "bitsandbytes"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

training:
  output_dir: "checkpoints/week6-first-sft"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 50
  eval_steps: 50
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  ddp_find_unused_parameters: false
  report_to: "none"
  seed: 42
  fp16: false
  bf16: true
  optim: "paged_adamw_8bit"
  max_seq_length: 2048

data:
  train_file: "datasets/generated/train/repo_qa.jsonl"
  val_file: "datasets/generated/val/repo_qa.jsonl"
  test_file: "datasets/generated/test/repo_qa.jsonl"
  instruction_template: "### Instruction:\n{instruction}\n\n### Context:\n{context}\n\n### Response:\n"
  truncation_side: "left"

resume:
  enabled: false
  checkpoint_path: ""
