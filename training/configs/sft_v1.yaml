model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  dtype: "bfloat16"
  attn_implementation: "sdpa"
  device_map: "auto"

quantization:
  enabled: true
  method: "bitsandbytes"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "checkpoints/sft_v1"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  ddp_find_unused_parameters: false
  report_to: "none"
  seed: 42
  fp16: false
  bf16: true
  optim: "paged_adamw_8bit"
  max_seq_length: 2048

data:
  train_file: "datasets/v1/sft/train/combined.jsonl"
  val_file: "datasets/v1/sft/val/combined.jsonl"
  test_file: "datasets/v1/sft/test/combined.jsonl"
  instruction_template: "### Instruction:\n{instruction}\n\n### Context:\n{context}\n\n### Response:\n"
  truncation_side: "left"

resume:
  enabled: false
  checkpoint_path: ""
