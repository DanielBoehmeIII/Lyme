[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyme"
version = "1.0.0-rc1"
description = "One-command repo repair. Diagnose, prioritize, fix, verify."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lyme Research"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

keywords = ["repo-repair", "code-quality", "developer-tools", "diagnostics"]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "peft>=0.7.0",
    "safetensors>=0.3.0",
    "bitsandbytes>=0.41.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "wheel>=0.40",
]

[project.urls]
Homepage = "https://github.com/anomalyco/lyme"
Source = "https://github.com/anomalyco/lyme"
Documentation = "https://lyme.ai/docs"

[project.scripts]
lyme = "lyme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lyme*"]

[tool.setuptools.package-data]
"lyme.ui.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/lyme"]
omit = ["*/tests/*", "*/lyme_model/*"]
