name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test CLI smoke
        run: python -m pytest tests/test_cli_smoke.py -x --tb=short -q
      - name: Test import
        run: python -c "import lyme; print(f'Lyme v{lyme.__version__}')"

  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test install script
        shell: bash
        run: |
          pip install build wheel
          pip install -e .
          python -c "import lyme; print(f'Lyme v{lyme.__version__}')"
          lyme --help
          lyme doctor --help
          lyme heal --help
